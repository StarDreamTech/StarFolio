[package]
name = "starfolio"
version = "0.2.2"
edition = "2021"
rust-version = "1.90"
default-run = "starfolio"
description = "Private offline reading for articles and discussions"
license = "MIT"

[lib]
name = "starfolio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "starfolio"
path = "src/main.rs"
required-features = ["app"]

[features]
default = ["app"]
app = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener", "dep:arboard", "dep:jni", "dep:objc2-ui-kit", "dep:objc2-foundation", "dep:objc2"]
custom-protocol = ["app", "tauri/custom-protocol"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
ego-tree = "0.10"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
url = "2"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-opener = { version = "2", optional = true }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSString"], optional = true }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UIPasteboard"], optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[profile.dev]
debug = 0
incremental = false
[profile.release]
strip = "debuginfo"
[profile.release.build-override]
strip = "none"
