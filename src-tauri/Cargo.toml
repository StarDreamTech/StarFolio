[package]
name = "starfolio"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
default-run = "starfolio"
description = "Private offline reading for articles and discussions"
license = "MIT"

[lib]
name = "starfolio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "starfolio"
path = "src/main.rs"
required-features = ["app"]

[features]
default = ["app"]
app = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener"]
custom-protocol = ["app", "tauri/custom-protocol"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
ego-tree = "0.10"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
url = "2"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-opener = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[profile.dev]
debug = 0
incremental = false
[profile.release]
strip = "debuginfo"
[profile.release.build-override]
strip = "none"
