<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>星藏 · StarFolio</title><link rel="stylesheet" href="app.css"><script src="app.js" defer></script></head><body><header><div class="brand"><span aria-hidden="true">✧</span> 星藏 <small>StarFolio</small></div><span class="local">● 仅存本机</span></header><main id="library"><p class="kicker">PERSONAL WEB ARCHIVE</p><h1>把值得重读的，<br>留在自己的书架。</h1><p>保存正文、配图和可见讨论。离线再读，不加载源站脚本。</p><form id="capture"><label for="url">文章或讨论链接</label><div class="row"><input id="url" type="url" placeholder="https://…" required autocomplete="off"><button id="save">归档链接</button></div><details><summary>导入浏览器保存的页面</summary><p>先填上方原文链接，再选 UTF-8 HTML 或星藏论坛 JSON（最大 16 MiB）。仅导入文件中已有的正文和评论；远程图片会尝试下载。</p><input type="file" id="file" accept=".html,.htm,.json"></details></form><section><div class="heading"><h2>我的书架</h2><input id="find" type="search" placeholder="筛选标题或站点" aria-label="筛选书架"></div><div id="items"></div></section><details><summary>私人资料夹</summary><p id="location"></p><p>不会上传至 GitHub，也不是加密保险箱。请自行保护系统账号和备份。</p></details></main><section id="reader" hidden><div class="tools"><button class="quiet" id="back">← 书架</button><button class="quiet" id="auditBtn">AI 复核</button><button class="quiet" id="edit">站点阅读样式</button></div><iframe id="frame" sandbox="allow-same-origin" title="离线阅读页" referrerpolicy="no-referrer"></iframe></section><dialog id="auditPanel"><h2>归档复核</h2><p id="auditState"></p><div class="row"><button class="quiet" id="dismissAudit">关闭</button><button id="again">重新复核</button></div></dialog><dialog id="styler"><form method="dialog"><h2>站点阅读样式</h2><p>这份 CSS 对此站点的全部归档有效，只存本机。</p><label for="css">CSS</label><textarea id="css" spellcheck="false"></textarea><div class="row"><button value="cancel" class="quiet">取消</button><button id="apply" type="button">保存样式</button></div></form></dialog><div role="status" aria-live="polite" id="status"></div></body></html>
