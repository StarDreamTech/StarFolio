name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, bundle: deb }
          - { os: windows-latest, bundle: nsis }
          - { os: macos-latest, bundle: app }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - run: npm test
      - run: npm run tauri -- build --ci --debug --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS'
        with:
          name: StarFolio-${{ runner.os }}-test
          path: |
            src-tauri/target/debug/bundle/deb/*.deb
            src-tauri/target/debug/bundle/nsis/*.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@1.90.0
        with: { targets: aarch64-linux-android }
      - run: npm ci
      - name: Prepare Android environment
        run: |
          sdkmanager 'ndk;27.2.12479018' 'platforms;android-36' 'build-tools;36.0.0'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm run tauri -- android init --ci --skip-targets-install
      - run: npm run tauri -- android build --ci --debug --target aarch64 --apk
      - uses: actions/upload-artifact@v4
        with:
          name: StarFolio-Android-test
          path: src-tauri/gen/android/**/outputs/apk/**/*.apk
          if-no-files-found: error
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@1.90.0
        with: { targets: aarch64-apple-ios-sim }
      - run: npm ci
      - run: npm run tauri -- ios build --ci --debug --target aarch64-sim --no-sign --archive-only
